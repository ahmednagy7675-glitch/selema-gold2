<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELEMA GOLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --walnut:#1c140e; --gold:#ba8d56; --cream:#fbf8f4; --beige:#e5ceae; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ffffff; color: var(--walnut); font-family: Montserrat, Cairo, Segoe UI, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: row; }
  .bar {
    direction: rtl;
    display: flex; flex-direction: column; flex-wrap: nowrap; gap: 16px; align-items: stretch;
    width: 280px; flex: 0 0 280px; box-sizing: border-box;
    padding: 22px 18px; background: #2a1c12;
    border-inline-start: 1px solid rgb(251 248 244 / 10%);
    order: 2; height: 100vh; overflow-y: auto;
  }
  .bar .brand { font-weight: 700; font-size: 1.15rem; padding-bottom: 12px; margin-bottom: 4px; color: #e5ceae; border-bottom: 1px solid rgb(251 248 244 / 15%); }
  .bar label { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: #cbb79a; }
  .bar input[type="date"], .bar input[type="time"], .bar input[type="text"], .bar input[inputmode] {
    height: 40px; border: 1px solid rgb(205 158 102 / 40%); background: #3a2818;
    color: var(--cream); border-radius: 10px; padding: 0 10px; font: 700 1rem Montserrat, sans-serif;
    min-width: 0;
  }
  .bar input:focus { outline: 2px solid var(--gold); }
  .bar button {
    height: 40px; padding: 0 14px; border-radius: 10px; border: 0; cursor: pointer;
    font-weight: 700; font-size: 0.88rem; font-family: inherit;
  }
  .bar .primary { background: var(--gold); color: var(--walnut); }
  .bar .ghost { background: transparent; color: var(--cream); border: 1px solid rgb(251 248 244 / 18%); }
  .hint { width: 100%; margin: 0; font-size: 0.78rem; color: #cbb79a; }
  .stage-wrap {
    flex: 1; order: 1; min-width: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; padding: 20px 12px;
  }
  .stage { width: min(1080px, calc(100vw - 320px)); }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .bar {
      order: 1; width: 100%; flex: 0 0 auto; height: auto; max-height: 45vh;
      border-inline-start: 0; border-bottom: 1px solid rgb(251 248 244 / 10%);
    }
    .stage-wrap { order: 2; height: auto; }
    .stage { width: min(1080px, calc(100vw - 24px)); }
  }
  .scaler { position: relative; overflow: hidden; box-shadow: 0 24px 80px rgb(0 0 0 / 45%); }
  .poster {
    position: absolute; top: 0; left: 0; width: 1080px; height: 1080px;
    background: var(--beige); transform-origin: 0 0; user-select: none; direction: ltr;
  }
  .poster-art { position: absolute; inset: 0; width: 1080px; height: 1080px; display: block; pointer-events: none; }
  .poster { --pill-font-size: 21px; --price-font-size: 36px; }
  .pill {
    position: absolute; top: 19px; height: 59px; width: 317px; border-radius: 999px;
    background: #ba8d56; color: #faf7ef; display: flex; align-items: center; justify-content: center;
    font-family: Montserrat, Segoe UI, sans-serif; font-weight: 700; font-size: var(--pill-font-size);
    letter-spacing: 0.06em; white-space: nowrap;
  }
  .pill-date { left: 8px; }
  .pill-time { left: 744px; }
  .price-slot {
    position: absolute; width: 200px; height: 52px; transform: translate(-50%, -50%);
    display: grid; place-items: center;
  }
  .price-patch { position: absolute; inset: 2px 8px; background: #cd9e66; border-radius: 4px; }
  .price-face {
    position: relative; z-index: 1; font-family: Montserrat, Segoe UI, sans-serif;
    font-weight: 800; font-size: var(--price-font-size); line-height: 1; letter-spacing: -0.01em;
    color: #fbf8f4; font-variant-numeric: tabular-nums; text-align: center;
  }
  .price-input {
    width: 100%; height: 100%; background: transparent; border: 0; padding: 0; margin: 0;
    color: #fbf8f4; text-align: center; caret-color: #fbf8f4; appearance: none;
  }
  .price-input:focus { outline: none; box-shadow: inset 0 0 0 1px rgb(251 248 244 / 28%); border-radius: 8px; }
  @media print {
    .bar { display: none !important; }
    body, html { background: #fff; }
    .stage-wrap { padding: 0; }
    .stage, .scaler { width: 1080px !important; height: 1080px !important; box-shadow: none; }
    .poster { transform: none !important; }
    @page { size: 1080px 1080px; margin: 0; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">سليمة جولد</div>
  <label>يوم<input id="day" inputmode="numeric" maxlength="2" style="width:56px" value="23"></label>
  <label>شهر<input id="month" inputmode="numeric" maxlength="2" style="width:56px" value="9"></label>
  <label>سنة<input id="year" inputmode="numeric" maxlength="4" style="width:74px" value="2026"></label>
  <label>الوقت<input type="time" id="time" value="12:55"></label>
  <label>بيع 21<input id="sell" inputmode="decimal" value="6330"></label>
  <label>شراء 21<input id="buy" inputmode="decimal" value="7000.7"></label>
  <label>حجم خط التاريخ والوقت<input id="pillSize" type="number" min="10" max="45" step="1" value="21" style="width:70px"></label>
  <label>حجم خط الأسعار<input id="priceSize" type="number" min="14" max="60" step="1" value="36" style="width:70px"></label>
  <button type="button" class="primary" id="png">تحميل PNG</button>
  <button type="button" class="ghost" id="now">الوقت الحالي</button>
  <p class="hint">افتح الملف في Chrome — عدّل التاريخ والوقت، ارفع الصورة، وبعدين حمّل PNG أو اطبع الصفحة.</p>
</header>

<script>
(function () {
  var BASE = 875;
  var KARATS = [{"id":"18k","purity":750,"isBase":false},{"id":"21k","purity":875,"isBase":true},{"id":"995k","purity":995,"isBase":false},{"id":"24k","purity":999.9,"isBase":false}];
  var SLOTS = {"18k":{"sell":{"x":141,"y":676},"buy":{"x":141,"y":835}},"21k":{"sell":{"x":421,"y":676},"buy":{"x":421,"y":835}},"995k":{"sell":{"x":691,"y":676},"buy":{"x":691,"y":835}},"24k":{"sell":{"x":958,"y":676},"buy":{"x":958,"y":835}}};
  var dayEl = document.getElementById("day");
  var monthEl = document.getElementById("month");
  var yearEl = document.getElementById("year");
  var timeEl = document.getElementById("time");
  var sellEl = document.getElementById("sell");
  var buyEl = document.getElementById("buy");
  var art = document.getElementById("art");
  var datePill = document.getElementById("datePill");
  var timePill = document.getElementById("timePill");
  var pillSizeEl = document.getElementById("pillSize");
  var priceSizeEl = document.getElementById("priceSize");
  var posterEl = document.getElementById("poster");

  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(n) {
    if (!isFinite(n)) return "—";
    var r = Math.round(n * 100) / 100;
    return String(Number(r.toFixed(2)));
  }
  function clockParts() {
    var t = (timeEl.value || "00:00").split(":");
    var day = +dayEl.value || 1, month = +monthEl.value || 1, year = +yearEl.value || 2026;
    var h24 = Math.min(23, Math.max(0, +t[0] || 0));
    var minute = Math.min(59, Math.max(0, +t[1] || 0));
    var period = h24 >= 12 ? "PM" : "AM";
    var hour = h24 % 12; if (hour === 0) hour = 12;
    return { day: day, month: month, year: year, hour: hour, minute: minute, period: period };
  }
  function paintPills() {
    var p = clockParts();
    datePill.textContent = "DATE: " + p.day + "\\ " + p.month + "\\" + p.year;
    timePill.textContent = "TIME: " + p.hour + ":" + pad(p.minute) + " " + p.period;
  }
  function num(el) {
    var n = Number(String(el.value).replace(/,/g, "").trim());
    return isFinite(n) ? n : 0;
  }
  function paintPrices() {
    var sell = num(sellEl), buy = num(buyEl);
    KARATS.forEach(function (k) {
      var s = k.isBase ? sell : (sell * k.purity) / BASE;
      var b = k.isBase ? buy : (buy * k.purity) / BASE;
      var sNode = document.querySelector('[data-karat="' + k.id + '"][data-kind="sell"]');
      var bNode = document.querySelector('[data-karat="' + k.id + '"][data-kind="buy"]');
      if (sNode) {
        if (sNode.tagName === "INPUT") { if (document.activeElement !== sNode) sNode.value = fmt(s); }
        else sNode.textContent = fmt(s);
      }
      if (bNode) {
        if (bNode.tagName === "INPUT") { if (document.activeElement !== bNode) bNode.value = fmt(b); }
        else bNode.textContent = fmt(b);
      }
    });
  }
  function fit() {
    var stage = document.getElementById("stage");
    var scaler = document.getElementById("scaler");
    var poster = document.getElementById("poster");
    var w = stage.clientWidth;
    var availH = Math.max(240, window.innerHeight - 40);
    var s = Math.min(1, w / 1080, availH / 1080);
    scaler.style.width = (1080 * s) + "px";
    scaler.style.height = (1080 * s) + "px";
    poster.style.transform = "scale(" + s + ")";
  }
  function egyptNow() {
    var d = new Date(Date.now() + 3 * 60 * 1000);
    var parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Africa/Cairo", day: "numeric", month: "numeric", year: "numeric",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    function get(t) { return (parts.find(function (p) { return p.type === t; }) || {}).value || ""; }
    dayEl.value = +get("day");
    monthEl.value = +get("month");
    yearEl.value = get("year");
    timeEl.value = pad(+get("hour")) + ":" + pad(+get("minute"));
    paintPills();
  }
  function applySizes() {
    var ps = Math.max(8, Number(pillSizeEl.value) || 21);
    var prs = Math.max(8, Number(priceSizeEl.value) || 36);
    posterEl.style.setProperty("--pill-font-size", ps + "px");
    posterEl.style.setProperty("--price-font-size", prs + "px");
  }
  dayEl.addEventListener("input", paintPills);
  monthEl.addEventListener("input", paintPills);
  yearEl.addEventListener("input", paintPills);
  timeEl.addEventListener("input", paintPills);
  sellEl.addEventListener("input", paintPrices);
  buyEl.addEventListener("input", paintPrices);
  pillSizeEl.addEventListener("input", applySizes);
  priceSizeEl.addEventListener("input", applySizes);
  document.querySelectorAll(".price-input").forEach(function (el) {
    el.addEventListener("input", function () {
      if (el.getAttribute("data-kind") === "sell") sellEl.value = el.value;
      else buyEl.value = el.value;
      paintPrices();
    });
  });
  document.getElementById("now").addEventListener("click", egyptNow);
  document.getElementById("png").addEventListener("click", async function () {
    await document.fonts.ready;
    var canvas = document.createElement("canvas");
    canvas.width = 2160; canvas.height = 2160;
    var ctx = canvas.getContext("2d");
    ctx.scale(2, 2);
    ctx.drawImage(art, 0, 0, 1080, 1080);
    function pill(x, y, w, h, text) {
      ctx.fillStyle = "#ba8d56";
      ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
      ctx.fillStyle = "#faf7ef";
      ctx.font = "700 " + (Math.max(8, Number(pillSizeEl.value) || 21)) + "px Montserrat, Segoe UI, sans-serif";
      ctx.letterSpacing = "0.06em";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2 + 1);
    }
    var p = clockParts();
    pill(8, 19, 317, 59, "DATE: " + p.day + "\\ " + p.month + "\\" + p.year);
    pill(744, 19, 317, 59, "TIME: " + p.hour + ":" + pad(p.minute) + " " + p.period);
    var sell = num(sellEl), buy = num(buyEl);
    ctx.letterSpacing = "-0.01em";
    ctx.font = "800 " + (Math.max(8, Number(priceSizeEl.value) || 36)) + "px Montserrat, Segoe UI, sans-serif";
    KARATS.forEach(function (k) {
      var s = k.isBase ? sell : (sell * k.purity) / BASE;
      var b = k.isBase ? buy : (buy * k.purity) / BASE;
      [["sell", s], ["buy", b]].forEach(function (pair) {
        var slot = SLOTS[k.id][pair[0]];
        ctx.fillStyle = "#cd9e66";
        ctx.fillRect(slot.x - 92, slot.y - 24, 184, 48);
        ctx.fillStyle = "#fbf8f4";
        ctx.fillText(fmt(pair[1]), slot.x, slot.y + 1);
      });
    });
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "selema-gold-" + p.day + "-" + p.month + "-" + p.year + ".png";
      a.click();
    }, "image/png");
  });
  window.addEventListener("resize", fit);
  paintPills();
  paintPrices();
  applySizes();
  fit();
})();
